[package]
name = "api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "=0.8.5"
worker-macros = "=0.8.5"
worker-sys = "=0.8.5"
# Match the tested workers-rs 0.8.5 template/toolchain family.
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "=0.4.75"
js-sys = "=0.3.102"
web-sys = "=0.3.102"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracker-core = { package = "core", path = "../core" }
subtle = "2.6"
