[workspace]
members = ["crates/core", "crates/api"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# wasm-bindgen's catch wrappers require the externref table symbols.
strip = "debuginfo"
